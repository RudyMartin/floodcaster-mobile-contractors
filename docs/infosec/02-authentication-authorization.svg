<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mobile authentication and authorization flow</title>
  <desc id="desc">OAuth Authorization Code with PKCE flow from the PWA through Cognito, followed by server-side token validation, principal mapping, Floodcaster authorization, and issuance of bounded offline authority.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .title{font:700 34px Inter,Arial,sans-serif;fill:#0f172a}.sub{font:400 17px Inter,Arial,sans-serif;fill:#475569}
      .head{font:700 18px Inter,Arial,sans-serif;fill:#0f172a}.txt{font:400 14px Inter,Arial,sans-serif;fill:#334155}
      .step{font:700 14px Inter,Arial,sans-serif;fill:#fff}.label{font:600 13px Inter,Arial,sans-serif;fill:#334155}
      .flow{fill:none;stroke:#334155;stroke-width:2.7;marker-end:url(#a)}.return{fill:none;stroke:#2563eb;stroke-width:2.7;marker-end:url(#a)}
      .sep{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:7 7}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="60" y="58" class="title">Authentication ≠ authorization</text>
  <text x="60" y="88" class="sub">Cognito proves identity; Floodcaster grants bounded domain scope and offline authority.</text>

  <rect x="55" y="130" width="250" height="725" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="365" y="130" width="250" height="725" rx="18" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <rect x="675" y="130" width="250" height="725" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="985" y="130" width="250" height="725" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="1295" y="130" width="250" height="725" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="180" y="175" text-anchor="middle" class="head">Mobile PWA</text>
  <text x="490" y="175" text-anchor="middle" class="head">Cognito OAuth</text>
  <text x="800" y="175" text-anchor="middle" class="head">Public edge</text>
  <text x="1110" y="175" text-anchor="middle" class="head">Rust platform</text>
  <text x="1420" y="175" text-anchor="middle" class="head">Domain stores</text>
  <line x1="180" y1="200" x2="180" y2="810" class="sep"/><line x1="490" y1="200" x2="490" y2="810" class="sep"/>
  <line x1="800" y1="200" x2="800" y2="810" class="sep"/><line x1="1110" y1="200" x2="1110" y2="810" class="sep"/><line x1="1420" y1="200" x2="1420" y2="810" class="sep"/>

  <circle cx="180" cy="235" r="18" fill="#2563eb"/><text x="180" y="240" text-anchor="middle" class="step">1</text>
  <text x="80" y="275" class="txt">Generate random verifier</text><text x="80" y="298" class="txt">and S256 challenge</text>
  <path d="M198 330 L472 330" class="flow"/><text x="275" y="316" class="label">2 · authorize + challenge</text>
  <circle cx="490" cy="375" r="18" fill="#9333ea"/><text x="490" y="380" text-anchor="middle" class="step">3</text>
  <text x="390" y="414" class="txt">Authenticate user</text><text x="390" y="437" class="txt">apply IdP controls</text>
  <path d="M472 470 L198 470" class="return"/><text x="280" y="456" class="label">4 · authorization code</text>
  <path d="M198 525 L472 525" class="flow"/><text x="244" y="511" class="label">5 · code + verifier; no secret</text>
  <path d="M472 575 L198 575" class="return"/><text x="252" y="561" class="label">6 · access token</text>
  <rect x="85" y="615" width="190" height="95" rx="12" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="105" y="646" class="head">Transient token</text><text x="105" y="672" class="txt">short-lived access token</text><text x="105" y="694" class="txt">not a client secret</text>

  <path d="M275 680 C470 680 600 680 782 680" class="flow"/><text x="420" y="666" class="label">7 · HTTPS bearer → /mobile/v1/*</text>
  <path d="M818 680 L1092 680" class="flow"/><text x="875" y="666" class="label">route only</text>
  <rect x="1015" y="235" width="190" height="120" rx="12" fill="#fff" stroke="#34d399" stroke-width="2"/>
  <text x="1035" y="267" class="head">8 · Validate token</text><text x="1035" y="294" class="txt">signature · issuer</text><text x="1035" y="316" class="txt">audience/client · expiry</text><text x="1035" y="338" class="txt">token_use = access</text>
  <path d="M1110 662 L1110 365" class="flow"/>
  <rect x="1015" y="405" width="190" height="95" rx="12" fill="#fff" stroke="#34d399" stroke-width="2"/>
  <text x="1035" y="437" class="head">9 · Map identity</text><text x="1035" y="464" class="txt">Cognito sub → governed</text><text x="1035" y="486" class="txt">Floodcaster principal</text>
  <path d="M1205 455 L1402 455" class="flow"/>
  <rect x="1325" y="380" width="190" height="150" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="1345" y="412" class="head">10 · Authorize</text><text x="1345" y="439" class="txt">organization · team</text><text x="1345" y="461" class="txt">AOI · action · policy</text><text x="1345" y="493" class="txt">Cognito groups are not</text><text x="1345" y="515" class="txt">the domain authority</text>
  <path d="M1402 555 C1320 555 1280 555 1205 555" class="return"/>
  <rect x="1015" y="525" width="190" height="100" rx="12" fill="#fff" stroke="#34d399" stroke-width="2"/>
  <text x="1035" y="557" class="head">11 · Issue authority</text><text x="1035" y="584" class="txt">signed bounded offline</text><text x="1035" y="606" class="txt">scope + time window</text>
  <path d="M1092 575 C820 790 470 790 275 700" class="return"/><text x="635" y="775" class="label">12 · signed offline authority artifact</text>

  <rect x="55" y="885" width="1490" height="70" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="80" y="914" class="head" fill="#991b1b">Must never happen</text>
  <text x="330" y="914" class="txt">client secret or IAM credentials in PWA · ID token accepted as API authorization · Cognito group used as AOI/action authority</text>
  <text x="80" y="940" class="txt">The edge cannot invent a domain outcome. Access-token expiry and offline-authority expiry are separate clocks, each validated by its owning control.</text>
</svg>
