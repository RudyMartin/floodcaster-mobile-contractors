<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Sensitive data and secret lifecycle</title>
  <desc id="desc">Information-flow matrix showing which security-relevant objects may exist in transient browser memory, IndexedDB, OPFS, HTTPS requests, governed server stores, or KMS, plus prohibited locations.</desc>
  <defs><style>
    .title{font:700 34px Inter,Arial,sans-serif;fill:#0f172a}.sub{font:400 17px Inter,Arial,sans-serif;fill:#475569}.head{font:700 16px Inter,Arial,sans-serif;fill:#0f172a}.headWhite{font:700 16px Inter,Arial,sans-serif;fill:#fff}.txt{font:400 13px Inter,Arial,sans-serif;fill:#334155}.yes{font:700 18px Inter,Arial,sans-serif;fill:#166534}.no{font:700 18px Inter,Arial,sans-serif;fill:#991b1b}.cond{font:700 15px Inter,Arial,sans-serif;fill:#92400e}.cell{stroke:#cbd5e1;stroke-width:1}.row{font:600 14px Inter,Arial,sans-serif;fill:#0f172a}.note{font:500 12px Inter,Arial,sans-serif;fill:#475569}
  </style></defs>
  <rect width="1600" height="1050" fill="#f8fafc"/>
  <text x="60" y="58" class="title">Sensitive-data lifecycle and storage policy</text>
  <text x="60" y="88" class="sub">A public PWA cannot keep a secret. Minimize, bind, encrypt in transit, and keep authority at the server.</text>

  <g transform="translate(45,135)">
    <rect x="0" y="0" width="1510" height="70" fill="#0f172a" rx="12"/>
    <text x="20" y="42" class="headWhite">Security object</text><text x="365" y="42" class="headWhite">Transient memory</text><text x="575" y="42" class="headWhite">IndexedDB</text><text x="755" y="42" class="headWhite">OPFS</text><text x="910" y="42" class="headWhite">HTTPS</text><text x="1065" y="42" class="headWhite">Server store</text><text x="1265" y="42" class="headWhite">KMS / HSM</text>

    <rect x="0" y="70" width="1510" height="80" fill="#fff" class="cell"/><text x="20" y="104" class="row">PKCE verifier</text><text x="20" y="128" class="note">single login transaction</text><text x="420" y="112" text-anchor="middle" class="yes">YES</text><text x="640" y="112" text-anchor="middle" class="no">NO</text><text x="795" y="112" text-anchor="middle" class="no">NO</text><text x="950" y="104" text-anchor="middle" class="cond">TOKEN</text><text x="950" y="127" text-anchor="middle" class="note">exchange only</text><text x="1135" y="112" text-anchor="middle" class="no">NO</text><text x="1335" y="112" text-anchor="middle" class="no">NO</text>
    <rect x="0" y="150" width="1510" height="80" fill="#f8fafc" class="cell"/><text x="20" y="184" class="row">Cognito access token</text><text x="20" y="208" class="note">short-lived bearer credential</text><text x="420" y="192" text-anchor="middle" class="yes">YES</text><text x="640" y="184" text-anchor="middle" class="cond">AVOID</text><text x="640" y="207" text-anchor="middle" class="note">no durable default</text><text x="795" y="192" text-anchor="middle" class="no">NO</text><text x="950" y="192" text-anchor="middle" class="yes">YES</text><text x="1135" y="184" text-anchor="middle" class="cond">VERIFY</text><text x="1135" y="207" text-anchor="middle" class="note">do not persist raw</text><text x="1335" y="192" text-anchor="middle" class="no">NO</text>
    <rect x="0" y="230" width="1510" height="80" fill="#fff" class="cell"/><text x="20" y="264" class="row">Signed offline authority</text><text x="20" y="288" class="note">bounded scope + time window</text><text x="420" y="272" text-anchor="middle" class="yes">YES</text><text x="640" y="272" text-anchor="middle" class="yes">YES</text><text x="795" y="272" text-anchor="middle" class="no">NO</text><text x="950" y="272" text-anchor="middle" class="yes">YES</text><text x="1135" y="272" text-anchor="middle" class="yes">YES</text><text x="1335" y="272" text-anchor="middle" class="no">NO</text>
    <rect x="0" y="310" width="1510" height="80" fill="#f8fafc" class="cell"/><text x="20" y="344" class="row">Offline operation + journal</text><text x="20" y="368" class="note">FIELD_REVIEWED claim</text><text x="420" y="352" text-anchor="middle" class="yes">YES</text><text x="640" y="352" text-anchor="middle" class="yes">YES</text><text x="795" y="352" text-anchor="middle" class="no">NO</text><text x="950" y="352" text-anchor="middle" class="yes">YES</text><text x="1135" y="352" text-anchor="middle" class="yes">YES</text><text x="1335" y="352" text-anchor="middle" class="no">NO</text>
    <rect x="0" y="390" width="1510" height="80" fill="#fff" class="cell"/><text x="20" y="424" class="row">Exact PMTiles bytes</text><text x="20" y="448" class="note">derived presentation artifact</text><text x="420" y="432" text-anchor="middle" class="cond">STREAM</text><text x="640" y="432" text-anchor="middle" class="no">NO</text><text x="795" y="432" text-anchor="middle" class="yes">YES</text><text x="950" y="432" text-anchor="middle" class="yes">YES</text><text x="1135" y="432" text-anchor="middle" class="yes">YES</text><text x="1335" y="432" text-anchor="middle" class="no">NO</text>
    <rect x="0" y="470" width="1510" height="80" fill="#f8fafc" class="cell"/><text x="20" y="504" class="row">Certificate + receipt</text><text x="20" y="528" class="note">server determination evidence</text><text x="420" y="512" text-anchor="middle" class="yes">YES</text><text x="640" y="512" text-anchor="middle" class="yes">YES</text><text x="795" y="512" text-anchor="middle" class="no">NO</text><text x="950" y="512" text-anchor="middle" class="yes">YES</text><text x="1135" y="512" text-anchor="middle" class="yes">YES</text><text x="1335" y="512" text-anchor="middle" class="no">NO</text>
    <rect x="0" y="550" width="1510" height="80" fill="#fff" class="cell"/><text x="20" y="584" class="row">Signing private key</text><text x="20" y="608" class="note">never exportable to application</text><text x="420" y="592" text-anchor="middle" class="no">NO</text><text x="640" y="592" text-anchor="middle" class="no">NO</text><text x="795" y="592" text-anchor="middle" class="no">NO</text><text x="950" y="592" text-anchor="middle" class="no">NO</text><text x="1135" y="592" text-anchor="middle" class="no">NO</text><text x="1335" y="592" text-anchor="middle" class="yes">YES</text>
    <rect x="0" y="630" width="1510" height="80" fill="#f8fafc" class="cell"/><text x="20" y="664" class="row">Authoritative geometry/state</text><text x="20" y="688" class="note">feature, AOI, revision, mutation</text><text x="420" y="672" text-anchor="middle" class="no">NO</text><text x="640" y="672" text-anchor="middle" class="no">NO</text><text x="795" y="672" text-anchor="middle" class="no">NO</text><text x="950" y="672" text-anchor="middle" class="cond">RESULTS</text><text x="1135" y="672" text-anchor="middle" class="yes">YES</text><text x="1335" y="672" text-anchor="middle" class="no">NO</text>
  </g>

  <rect x="45" y="885" width="480" height="105" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="70" y="920" class="head" fill="#166534">Allowed public-client material</text><text x="70" y="947" class="txt">public configuration · short-lived access token · signed bounded</text><text x="70" y="970" class="txt">authority · verified pack · operation claims · returned evidence</text>
  <rect x="560" y="885" width="480" height="105" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="585" y="920" class="head" fill="#92400e">Minimize and redact</text><text x="585" y="947" class="txt">precise location · photos · operation payloads · device identifiers</text><text x="585" y="970" class="txt">Never place them in URLs, analytics, crash reports, or public logs.</text>
  <rect x="1075" y="885" width="480" height="105" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1100" y="920" class="head" fill="#991b1b">Never in PWA or public repository</text><text x="1100" y="947" class="txt">client secret · service key · AWS credential · database credential</text><text x="1100" y="970" class="txt">KMS private key · customer/private data · production internals</text>
</svg>
