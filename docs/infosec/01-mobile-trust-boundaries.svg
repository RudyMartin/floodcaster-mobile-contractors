<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Floodcaster Mobile MVP1 trust boundaries</title>
  <desc id="desc">Security architecture showing the public device, identity and edge, governed Rust services, authoritative stores, permitted HTTPS flows, and prohibited direct paths.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/></marker>
    <style>
      .title{font:700 34px Inter,Arial,sans-serif;fill:#0f172a}.sub{font:400 17px Inter,Arial,sans-serif;fill:#475569}
      .zoneTitle{font:700 19px Inter,Arial,sans-serif;fill:#0f172a}.zoneSub{font:400 14px Inter,Arial,sans-serif;fill:#475569}
      .nodeTitle{font:700 17px Inter,Arial,sans-serif;fill:#0f172a}.nodeText{font:400 14px Inter,Arial,sans-serif;fill:#334155}
      .small{font:500 13px Inter,Arial,sans-serif;fill:#475569}.label{font:600 13px Inter,Arial,sans-serif;fill:#334155}
      .flow{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
      .deny{fill:none;stroke:#b91c1c;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#arrowRed)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="60" y="58" class="title">Mobile MVP1 — trust boundaries and permitted paths</text>
  <text x="60" y="88" class="sub">The client records claims; only governed server components determine and mutate authoritative state.</text>

  <rect x="50" y="130" width="330" height="690" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="75" y="168" class="zoneTitle">1 · Public device</text><text x="75" y="193" class="zoneSub">Untrusted execution environment</text>
  <rect x="80" y="230" width="270" height="100" rx="14" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="105" y="266" class="nodeTitle">Svelte PWA</text><text x="105" y="292" class="nodeText">UI + typed HTTPS client</text><text x="105" y="314" class="nodeText">never an execution authority</text>
  <rect x="80" y="370" width="270" height="88" rx="14" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="105" y="405" class="nodeTitle">IndexedDB</text><text x="105" y="431" class="nodeText">journal · authority · receipts</text>
  <rect x="80" y="495" width="270" height="88" rx="14" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="105" y="530" class="nodeTitle">OPFS</text><text x="105" y="556" class="nodeText">verified immutable PMTiles</text>
  <rect x="80" y="620" width="270" height="90" rx="14" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="105" y="655" class="nodeTitle">Transient session</text><text x="105" y="681" class="nodeText">PKCE verifier + access token</text>

  <rect x="430" y="130" width="320" height="690" rx="22" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="455" y="168" class="zoneTitle">2 · Identity and edge</text><text x="455" y="193" class="zoneSub">Internet-facing control points</text>
  <rect x="460" y="250" width="260" height="105" rx="14" fill="#fff" stroke="#c084fc" stroke-width="2"/>
  <text x="485" y="286" class="nodeTitle">Amazon Cognito</text><text x="485" y="312" class="nodeText">authentication + OAuth PKCE</text><text x="485" y="334" class="nodeText">identity, not domain authority</text>
  <rect x="460" y="470" width="260" height="115" rx="14" fill="#fff" stroke="#c084fc" stroke-width="2"/>
  <text x="485" y="506" class="nodeTitle">Cloudflare public edge</text><text x="485" y="532" class="nodeText">TLS · routing · coarse controls</text><text x="485" y="554" class="nodeText">no domain determination</text>

  <rect x="800" y="130" width="350" height="690" rx="22" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="825" y="168" class="zoneTitle">3 · Governed application</text><text x="825" y="193" class="zoneSub">Private service trust boundary</text>
  <rect x="835" y="245" width="280" height="130" rx="14" fill="#fff" stroke="#34d399" stroke-width="2"/>
  <text x="860" y="281" class="nodeTitle">Rust floodcaster-platform</text><text x="860" y="307" class="nodeText">token + authority verification</text><text x="860" y="329" class="nodeText">scope · revision · replay gates</text><text x="860" y="351" class="nodeText">sole reconciliation authority</text>
  <rect x="835" y="455" width="280" height="105" rx="14" fill="#fff" stroke="#34d399" stroke-width="2"/>
  <text x="860" y="491" class="nodeTitle">Certificate publisher</text><text x="860" y="517" class="nodeText">sign persisted canonical bytes</text><text x="860" y="539" class="nodeText">publish only after verification</text>
  <rect x="835" y="640" width="280" height="95" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="860" y="676" class="nodeTitle">Python tooling</text><text x="860" y="702" class="nodeText">build/data/verification only</text>

  <rect x="1200" y="130" width="350" height="690" rx="22" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="1225" y="168" class="zoneTitle">4 · Authoritative services</text><text x="1225" y="193" class="zoneSub">No public client access</text>
  <rect x="1235" y="245" width="280" height="105" rx="14" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="1260" y="281" class="nodeTitle">Aurora / PostGIS</text><text x="1260" y="307" class="nodeText">features · AOI · revisions</text><text x="1260" y="329" class="nodeText">authoritative mutation</text>
  <rect x="1235" y="430" width="280" height="105" rx="14" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="1260" y="466" class="nodeTitle">Certificate + receipt store</text><text x="1260" y="492" class="nodeText">canonical bytes · idempotency</text><text x="1260" y="514" class="nodeText">publication state</text>
  <rect x="1235" y="615" width="280" height="95" rx="14" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="1260" y="651" class="nodeTitle">AWS KMS</text><text x="1260" y="677" class="nodeText">private signing key custody</text>

  <path d="M350 280 C405 280 405 302 460 302" class="flow"/><text x="374" y="265" class="label">OAuth PKCE</text>
  <path d="M460 330 C405 380 405 665 350 665" class="flow"/><text x="372" y="503" class="label">access token</text>
  <path d="M350 292 C405 355 405 527 460 527" class="flow"/><text x="370" y="430" class="label">HTTPS JSON</text>
  <path d="M720 527 C770 527 785 310 835 310" class="flow"/><text x="744" y="408" class="label">/mobile/v1/*</text>
  <path d="M1115 310 L1235 298" class="flow"/><text x="1135" y="286" class="label">atomic transaction</text>
  <path d="M1115 502 L1235 482" class="flow"/><text x="1136" y="470" class="label">publish state</text>
  <path d="M1235 662 C1175 662 1175 520 1115 520" class="flow"/><text x="1170" y="650" class="label">signature</text>
  <path d="M975 640 L975 375" class="dash"/><text x="860" y="610" class="label">offline/build input only</text>

  <path d="M350 245 L350 105 L1180 105 L1180 220 L1235 245" class="deny"/><text x="690" y="124" class="label" fill="#b91c1c">FORBIDDEN: PWA → database</text>
  <path d="M350 700 C540 865 760 865 835 700" class="deny"/><text x="480" y="875" class="label" fill="#b91c1c">FORBIDDEN: browser → Python/runtime subprocess</text>

  <rect x="50" y="860" width="1500" height="95" rx="16" fill="#fff" stroke="#cbd5e1"/>
  <line x1="80" y1="895" x2="145" y2="895" class="flow"/><text x="160" y="901" class="small">permitted runtime flow</text>
  <line x1="390" y1="895" x2="455" y2="895" class="dash"/><text x="470" y="901" class="small">governed offline/build flow</text>
  <line x1="755" y1="895" x2="820" y2="895" class="deny"/><text x="835" y="901" class="small">prohibited direct path</text>
  <text x="80" y="930" class="small">Core invariant: the public client submits evidence; the Rust boundary determines; authoritative stores commit.</text>
</svg>
