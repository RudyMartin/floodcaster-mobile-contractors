  <rect x="188" y="480" width="156" height="40" fill="#ddd" stroke="#222"/>
  <text x="266" y="504" text-anchor="middle">Refresh status</text>
  <text x="24" y="560" fill="#777" font-size="10">No edit / delete / re-issue controls exist on this screen.</text>
