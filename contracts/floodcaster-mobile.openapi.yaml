openapi: 3.1.0
info:
  title: Floodcaster Mobile POC API
  version: 0.2.0-draft
  description: >-
    POC_CONTRACT_DRAFT. Synthetic public evaluation surface only. This contract
    is not a production endpoint commitment and exposes no Floodcaster internals.
servers:
  - url: http://localhost:8787
    description: TEST_ONLY local mock
tags:
  - name: Read models
  - name: Operations
  - name: Session
paths:
  /mobile/v1/session:
    post:
      tags: [Session]
      summary: Obtain a TEST_ONLY session token
      description: >-
        Simulates authentication for the POC. The mock enforces expiry so
        clients can prove queued work survives an expired session; the
        X-Floodcaster-Mock-Session-State header forces expiry deterministically.
      responses:
        '201':
          description: Session token with explicit expiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  /mobile/v1/bootstrap:
    get:
      tags: [Read models]
      summary: Load the synthetic POC entry point
      responses:
        '200':
          description: Bootstrap read model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bootstrap'
  /mobile/v1/properties:
    get:
      tags: [Read models]
      summary: Search the test corpus properties
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring over property_id and display_address
      responses:
        '200':
          description: Up to 20 matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertySearchResult'
  /mobile/v1/layers:
    get:
      tags: [Read models]
      summary: List the corpus flood presentation layers with pinned digests
      responses:
        '200':
          description: Layer index (feature counts, sizes, sha256) from the corpus manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayerIndex'
  /mobile/v1/layers/{layer_name}:
    get:
      tags: [Read models]
      summary: Stream one corpus flood layer as GeoJSON
      description: >-
        Presentation/test data only; layer content is never authorization or an
        authoritative area-of-interest boundary. Bytes match the sha256 pinned
        in the layer index. flood-stress-3x is the performance probe input.
      parameters:
        - name: layer_name
          in: path
          required: true
          schema:
            type: string
            enum: [flood-normal, flood-complex, flood-stress-3x]
      responses:
        '200':
          description: GeoJSON FeatureCollection (WGS 84)
          content:
            application/geo+json:
              schema: { type: object }
        '404':
          $ref: '#/components/responses/NotFound'
  /mobile/v1/map-pack:
    get:
      tags: [Read models]
      summary: Download the offline map pack binary
      description: >-
        PMTiles archive for the corpus test area. The client verifies the
        downloaded bytes against content_sha256 from the bootstrap map_pack
        manifest before marking the pack available offline. Presentation data
        only; pack membership is never authorization.
      responses:
        '200':
          description: PMTiles binary
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /mobile/v1/properties/{property_id}:
    get:
      tags: [Read models]
      summary: Get a server-owned property read model
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        '200':
          description: Property read model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyReadModel'
        '404':
          $ref: '#/components/responses/NotFound'
  /mobile/v1/determinations/{determination_id}:
    get:
      tags: [Read models]
      summary: Get a persisted engine-issued determination
      parameters:
        - name: determination_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Issued determination
          content:
            application/json:
              schema:
                $ref: './schemas/issued-determination.schema.json'
        '404':
          $ref: '#/components/responses/NotFound'
  /mobile/v1/certificates/{certificate_id}:
    get:
      tags: [Read models]
      summary: Get the certificate attached to an issued determination
      parameters:
        - name: certificate_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Certificate envelope
          content:
            application/json:
              schema:
                $ref: './schemas/certificate.schema.json'
        '404':
          $ref: '#/components/responses/NotFound'
  /mobile/v1/operations:
    post:
      tags: [Operations]
      summary: Submit one durable client operation for server adjudication
      description: >-
        Requires a valid session token. X-Floodcaster-Mock-Scenario is accepted
        only by the TEST_ONLY mock and selects applied, verify-required,
        rejected, replay, or collision. X-Floodcaster-Mock-Session-State:
        expired forces an expired-session response regardless of token age.
      security:
        - sessionToken: []
      parameters:
        - name: X-Floodcaster-Mock-Session-State
          in: header
          required: false
          schema:
            type: string
            enum: [expired]
        - name: X-Floodcaster-Mock-Scenario
          in: header
          required: false
          schema:
            type: string
            enum: [applied, verify-required, rejected, replay, collision]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
      responses:
        '200':
          description: Acknowledged operation with separate domain outcome
          content:
            application/json:
              schema:
                $ref: './schemas/operation-result.schema.json'
        '401':
          description: >-
            Transport-layer authentication failure (AUTH_REQUIRED or
            AUTH_EXPIRED). Not a domain outcome; queued client work must
            survive it unchanged.
          content:
            application/json:
              schema:
                type: object
                required: [environment, error]
                properties:
                  environment: { const: TEST_ONLY }
                  error:
                    type: string
                    enum: [AUTH_REQUIRED, AUTH_EXPIRED]
        '409':
          description: Stable operation ID was reused with a different payload
          content:
            application/json:
              schema:
                $ref: './schemas/operation-result.schema.json'
components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: TEST_ONLY session token from POST /mobile/v1/session
  parameters:
    PropertyId:
      name: property_id
      in: path
      required: true
      schema: { type: string }
  responses:
    NotFound:
      description: Synthetic object not found
      content:
        application/json:
          schema:
            type: object
            required: [environment, error]
            properties:
              environment: { const: TEST_ONLY }
              error: { const: NOT_FOUND }
  schemas:
    OperationRequest:
      type: object
      additionalProperties: false
      required: [operation_id, operation_type, observation]
      properties:
        operation_id:
          type: string
          pattern: '^OP-TEST-[A-Z0-9-]+$'
        operation_type:
          const: SUBMIT_FIELD_OBSERVATION
        observation:
          $ref: './schemas/field-observation.schema.json'
    PropertySearchResult:
      type: object
      additionalProperties: false
      required: [environment, count, results]
      properties:
        environment: { const: TEST_ONLY }
        count: { type: integer }
        results:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [property_id, display_address]
            properties:
              property_id: { type: string }
              display_address: { type: string }
    LayerIndex:
      type: object
      additionalProperties: false
      required: [environment, aoi_bbox_wgs84, layers]
      properties:
        environment: { const: TEST_ONLY }
        aoi_bbox_wgs84:
          type: array
          items: { type: number }
        layers:
          type: array
          items:
            type: object
            required: [layer_name, feature_count, size_bytes, sha256]
            properties:
              layer_name: { type: string }
              file: { type: string }
              format: { type: string }
              crs: { type: string }
              feature_count: { type: integer }
              vertex_stats: { type: object }
              size_bytes: { type: integer }
              sha256: { type: string }
    Session:
      type: object
      additionalProperties: false
      required: [environment, session_token, expires_at]
      properties:
        environment: { const: TEST_ONLY }
        session_token: { type: string }
        expires_at: { type: string, format: date-time }
    Bootstrap:
      type: object
      additionalProperties: false
      required: [environment, contract_status, property_id, determination_id, certificate_id, map_pack]
      properties:
        environment: { const: TEST_ONLY }
        contract_status: { const: POC_CONTRACT_DRAFT }
        property_id: { type: string }
        determination_id: { type: string }
        certificate_id: { type: string }
        map_pack:
          $ref: './schemas/map-pack-manifest.schema.json'
    PropertyReadModel:
      type: object
      additionalProperties: false
      required: [environment, property_id, display_address, geometry, determination_ids]
      properties:
        environment: { const: TEST_ONLY }
        property_id: { type: string }
        display_address: { type: string }
        geometry:
          type: object
          required: [type, coordinates]
          properties:
            type: { const: Polygon }
            coordinates: { type: array }
        determination_ids:
          type: array
          items: { type: string }
